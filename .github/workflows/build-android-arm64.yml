name: Build Ren'Py 6 Android ARM64 Runtime

on:
  workflow_dispatch:
    inputs:
      archs:
        description: 'Architectures to compile (e.g. arm64_v8a or arm64_v8a,armeabi_v7a)'
        required: true
        default: 'arm64_v8a,armeabi_v7a'
        type: string

jobs:
  build-runtime:
    name: Build Android ARM64 & ARM32 (.so)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Ren'Py 6 Engine (branch tan)
        uses: actions/checkout@v4
        with:
          path: renpy

      - name: Checkout renpy-build Toolchain (branch fix-7)
        uses: actions/checkout@v4
        with:
          ref: fix-7
          path: renpy-build

      - name: Install System Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git build-essential ccache unzip autoconf autoconf-archive automake libtool-bin \
            python2-dev python3-dev python3-venv python3-jinja2 \
            curl bc libssl-dev libbz2-dev liblzma-dev debootstrap qemu-user-static \
            libgmp-dev libmpfr-dev libmpc-dev cmake clang

      - name: Install Python 2 Pip and Cython
        run: |
          curl -s https://bootstrap.pypa.io/pip/2.7/get-pip.py -o get-pip.py
          sudo python2 get-pip.py
          sudo python2 -m pip install "cython<3" jinja2 requests
          python3 -m pip install jinja2 requests

      - name: Clone Submodules and Build Dependencies
        run: |
          cd renpy-build
          git clone https://github.com/renpy/pygame_sdl2.git pygame_sdl2
          git clone https://github.com/renpy/renpyweb.git renpyweb

      - name: Link Ren'Py 6 into Build Tree
        run: |
          cd renpy-build
          ln -s ../renpy renpy

      - name: Download Android NDK r25c
        run: |
          cd renpy-build
          mkdir -p tars
          echo "Downloading android-ndk-r25c-linux.zip..."
          curl -L -o tars/android-ndk-r25c-linux.zip https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          ls -lh tars/android-ndk-r25c-linux.zip

      - name: Run Android Compilation (renpy-build)
        run: |
          cd renpy-build
          ./build.py --platforms android --archs ${{ github.event.inputs.archs }} --pythons 2

      - name: Validate Binary ABI & Symbols
        run: |
          echo "=== Verifying Generated Native Libraries ==="
          ARM64_SO=$(find renpy-build -name "librenpython.so" | grep "arm64-v8a" | head -n 1)
          if [ -n "$ARM64_SO" ]; then
            echo "Found ARM64 binary: $ARM64_SO"
            ls -lh "$ARM64_SO"
            readelf -h "$ARM64_SO"
            echo "--- Checking Ren'Py 6 Core Symbols ---"
            readelf -s "$ARM64_SO" | grep -E "initrenpy_style|initrenpy_display_render|init_renpy|initrenpy_gl_gldraw"
            echo "--- Checking for Absence of Ren'Py 7 GL2 Symbols ---"
            if readelf -s "$ARM64_SO" | grep -q "initrenpy_gl2"; then
              echo "ERROR: Ren'Py 7 gl2 symbol found in Ren'Py 6 binary!"
              exit 1
            fi
            echo "SUCCESS: ARM64 Binary validated successfully!"
          else
            echo "ERROR: arm64-v8a librenpython.so was not generated!"
            exit 1
          fi

      - name: Upload Ren'Py 6 Native Libraries
        uses: actions/upload-artifact@v4
        with:
          name: renpy6-android-runtime-${{ github.run_id }}
          path: |
            renpy-build/**/jniLibs/*/*.so
